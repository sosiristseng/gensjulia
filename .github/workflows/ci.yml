name: Deploy to GitHub pages

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # submodules: true # Fetch quartz (true OR recursive)
          fetch-depth: 0 # Fetch all history
      - name: Shallow clone submodules
        run: git submodule update --init --recursive --depth=1
      - name: Cache plugins
        id: cache-plugins
        uses: actions/cache@v6
        with:
          path: './runtime/.quartz/plugins'
          key: ${{ runner.os }}-quartz-plugins-${{ hashFiles('quartz.config.yaml') }}
      - name: Copy documents and settings to runtime
        run: |
          cp -vr quartz.config.yaml content/ runtime/
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: 'runtime/.node-version'
          cache-dependency-path: 'runtime/package-lock.json'
          cache: 'npm'
      - name: Build website
        run: 	cd runtime && npm ci && npx quartz plugin install --from-config && npx quartz build
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./runtime/public/
          force_orphan: true
          full_commit_message: ${{ github.event.head_commit.message }}
